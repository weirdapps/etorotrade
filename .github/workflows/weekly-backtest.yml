name: Weekly Backtest

on:
  schedule:
    # Run Saturday at 23:00 UTC (02:00 Athens Sunday)
    # Avoids Sunday daily-signals (~5h, starts 22:00 UTC) overlap on shared eToro creds
    - cron: '0 23 * * 6'
  workflow_dispatch: # Allow manual triggering

concurrency:
  group: weekly-backtest
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  run-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ secrets.PUSH_PAT }}

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install production deps (hashed lockfile)
        run: |
          pip install --only-binary :all: --require-hashes -r requirements-lock.txt

      - name: Run weekly backtest pipeline
        run: |
          echo "Running weekly backtest pipeline..."
          python scripts/run_weekly_backtest.py --ci
          echo "Backtest pipeline complete"

      - name: Validate backtest output
        run: |
          REPORT="yahoofinance/output/backtest_report.json"
          if [ ! -f "$REPORT" ]; then
            echo "ERROR: backtest_report.json not generated"
            exit 1
          fi
          SIZE=$(wc -c < "$REPORT")
          if [ "$SIZE" -lt 500 ]; then
            echo "ERROR: backtest_report.json is only $SIZE bytes (expected >500)"
            cat "$REPORT"
            exit 1
          fi
          echo "Backtest report validated: $SIZE bytes"
          python3 -c "
          import json
          with open('$REPORT') as f:
              r = json.load(f)
          h = r.get('headline', {})
          # CIO v17: presence-of-key validation (not 'is not None'). The
          # script always emits buy_count_t7=0 with status='no_data' when
          # Phase 1 produces nothing — the workflow should NOT fail on
          # data drought, only on schema regression.
          assert 'buy_count_t7' in h, 'Missing buy_count_t7 schema'
          assert 'signal_backtest_status' in h, 'Missing status field'
          status = h.get('signal_backtest_status', 'unknown')
          print(f'Phase 1 status: {status}')
          print(f'BUY T+7: {h.get(\"buy_hit_rate_t7\")}% (n={h.get(\"buy_count_t7\")})')
          print(f'SELL T+7: {h.get(\"sell_hit_rate_t7\")}% (n={h.get(\"sell_count_t7\")})')
          if status == 'no_data':
              print('NOTE: signal backtest had no data this run. Downstream '
                    'calibration phases continue.')
          "

      # THE COMMIT AND PUSH STEPS ARE RETIRED, 2026-09-12. They used to stage the
      # four backtest artifacts plus data/committee/action_log.jsonl and push them
      # to master. The producer moved to the VPS:
      #   plessas-trading-stack/scripts/weekly-backtest.sh, weekly-backtest.timer
      #
      # WHY IT MOVED, and why fixing CI further could not work. BacktestEngine's
      # only input is yahoofinance/output/signal_log.jsonl (backtest_engine.py:31),
      # gitignored at .gitignore:214 and, per signal_tracker.py:446, "destroyed
      # with the runner". So Phase 1 exited no_data here every week and the three
      # backtest_*.csv were never written at all. e204f822 fixed the other half of
      # that -- a `git add` on an ignored path exiting 1 behind `|| true`, which
      # had five consecutive runs going green while delivering nothing -- but a
      # missing input is not a staging problem. The VPS holds that log, fed daily
      # by signals-refresh.timer, and stood at 6462 lines when the job moved.
      #
      # ONE PRODUCER, deliberately. Leaving this step in place alongside the VPS
      # timer would put two jobs on the same four paths in one public repo, racing
      # on push. That is the clobber pattern that cost a live credential on
      # 2026-09-12, and here the loser would be silent.
      #
      # THE RUN AND THE VALIDATOR ABOVE STAY, as a schema canary. They still catch
      # a headline-schema regression on every push to the script, on a runner, for
      # free, and they no longer claim to publish anything. The artifact upload
      # below keeps a 90-day record of what CI saw.

      - name: Upload backtest artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backtest-${{ github.run_id }}
          path: |
            yahoofinance/output/backtest_results.csv
            yahoofinance/output/backtest_summary.csv
            yahoofinance/output/backtest_threshold_report.csv
            yahoofinance/output/backtest_report.json
          retention-days: 90
