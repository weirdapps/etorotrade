name: Dependabot auto-merge
'on': pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    # Shared implementation. Native `gh pr merge --auto` cannot work here
    # (branch protection is a paid feature on private repos, and
    # allow_auto_merge silently no-ops), so the reusable polls this PR's own
    # checks and merges once they are green. Majors stay open for review.
    uses: weirdapps/shared-workflows/.github/workflows/dependabot-auto-merge.yml@main
    with:
      # pip is excluded deliberately. This repo's source of truth is
      # poetry.lock, but pip-Dependabot edits only the DERIVED
      # requirements-*-lock.txt and leaves poetry.lock stale, so auto-merging a
      # pip PR desyncs the two. Python deps are updated via poetry plus
      # scripts/dev/relock.sh. Those PRs stay open for security visibility.
      exclude_branch_prefixes: "dependabot/pip/"
