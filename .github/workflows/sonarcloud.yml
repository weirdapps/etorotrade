name: SonarCloud Analysis

on:
  push:
    branches:
      - main
      - master
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  sonarcloud:
    if: ${{ !github.event.repository.private }}
    name: SonarCloud
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0  # Full history for SonarCloud blame

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install dependencies (production + dev, fully hashed)
        continue-on-error: true
        run: |
          pip install --only-binary :all: --require-hashes -r requirements-dev-lock.txt

      - name: Check for tests
        id: check-tests
        run: |
          if [ -d tests ] || [ -d test ] || [ -d __tests__ ]; then
            echo "has_tests=true" >> $GITHUB_OUTPUT
          else
            echo "has_tests=false" >> $GITHUB_OUTPUT
            echo "::notice::No tests directory found — SonarCloud will scan without coverage"
          fi

      - name: Run tests with coverage
        if: steps.check-tests.outputs.has_tests == 'true'
        continue-on-error: true
        run: pytest --cov=. --cov-report=xml --cov-report=term-missing || true

      - name: Check for SonarCloud token
        id: check-sonar
        run: |
          if [ -n "${{ secrets.SONAR_TOKEN }}" ]; then
            echo "has_token=true" >> $GITHUB_OUTPUT
          else
            echo "has_token=false" >> $GITHUB_OUTPUT
            echo "::notice::SONAR_TOKEN not configured — skipping SonarCloud scan"
          fi

      - name: SonarCloud Scan
        if: steps.check-sonar.outputs.has_token == 'true'
        uses: SonarSource/sonarcloud-github-action@ffc3010689be73b8e5ae0c57ce35968afd7909e8 # v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Fail if the server-side analysis failed
        # The scanner exits 0 the moment the report finishes uploading. Anything
        # that rejects the analysis afterwards happens in SonarCloud's Compute
        # Engine, which this job never looked at, so it went green while nothing
        # was measured. That is how weirdapps_plessas-lab stayed broken from
        # creation to 2026-08-29 with every run reporting success, and how the
        # free plan's 50,000-line org ceiling takes every repo down at once
        # without producing a single red build anywhere.
        if: steps.check-sonar.outputs.has_token == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          report=.scannerwork/report-task.txt
          if [ ! -f "$report" ]; then
            echo "::error::$report is missing, so the analysis cannot be confirmed"
            exit 1
          fi
          task_url=$(sed -n 's/^ceTaskUrl=//p' "$report")
          get() { python3 -c "import json,sys;print(json.load(sys.stdin)['task']$1)"; }
          for _ in $(seq 1 60); do
            body=$(curl -sS -u "${SONAR_TOKEN}:" "$task_url" || true)
            status=$(printf '%s' "$body" | get "['status']" 2>/dev/null || echo RETRY)
            case "$status" in
              SUCCESS)
                echo "Analysis completed server-side."
                exit 0
                ;;
              FAILED|CANCELED)
                msg=$(printf '%s' "$body" | get ".get('errorMessage','no message')")
                echo "::error::SonarCloud analysis $status: $msg"
                exit 1
                ;;
            esac
            sleep 5
          done
          echo "::error::Timed out after 5 minutes waiting for the SonarCloud analysis task"
          exit 1
