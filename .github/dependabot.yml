version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    reviewers:
      - "weirdapps"
    assignees:
      - "weirdapps"
    labels:
      - "dependencies"
      - "security"
    commit-message:
      prefix: "deps"
      include: "scope"
    # Only propose direct dependency updates. Transitive bumps are doomed:
    # the committed lockfile resolver reverts them, so those PRs never merge.
    # The monthly deps-refresh.yml workflow keeps transitive deps fresh instead.
    allow:
      - dependency-type: "direct"
    # Group patch and minor updates together
    groups:
      development-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
    # mando >=0.8 conflicts with radon 6.0.1 (which pins mando<0.8). Until
    # radon publishes a release supporting newer mando, ignore mando
    # majors/minors so dependabot stops opening unmergeable PRs.
    ignore:
      - dependency-name: "mando"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Group all GitHub Actions bumps into a single PR. codeql-action/init and
    # codeql-action/analyze are pinned to the same SHA and MUST move together;
    # separate PRs leave the steps on different versions and fail the analyze job.
    groups:
      github-actions:
        patterns:
          - "*"

  # Two Dockerfiles, both `FROM python:3.11-slim` (Dockerfile:2 and
  # .config/docker/Dockerfile:5). A base image is the one dependency that
  # accumulates OS-level CVEs while the tag never changes, so without these
  # entries the image silently rots: the pip ecosystem above sees the Python
  # packages inside the image and nothing at all sees the image itself.
  # Dependabot keys `docker` off the directory holding the Dockerfile, so the
  # two locations need one entry each.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "security"
    commit-message:
      prefix: "deps"
      include: "scope"

  - package-ecosystem: "docker"
    directory: "/.config/docker"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "security"
    commit-message:
      prefix: "deps"
      include: "scope"
